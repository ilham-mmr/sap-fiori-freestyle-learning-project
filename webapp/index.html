<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SAP Fiori Freestyle Learning Project</title>

  <!--
    index.html is used for standalone/local startup. In SAP Build Work Zone or
    Fiori Launchpad, the shell loads the component through its app descriptor.
  -->
  <script
    id="sap-ui-bootstrap"
    src="resources/sap-ui-core.js"
    data-sap-ui-theme="sap_horizon"
    data-sap-ui-resourceroots='{"sap.fiori.learning": "./"}'
    data-sap-ui-oninit="module:sap/ui/core/ComponentSupport"
    data-sap-ui-compatversion="edge"
    data-sap-ui-async="true"
    data-sap-ui-frameoptions="trusted">
  </script>
</head>
<body class="sapUiBody sapUiSizeCompact" id="content">
  <div
    data-sap-ui-component
    data-name="sap.fiori.learning"
    data-id="container"
    data-settings='{"id": "sap.fiori.learning"}'>
  </div>
</body>
</html>
